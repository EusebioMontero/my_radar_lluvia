<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de lluvia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Layout: mapa a pantalla completa, panel de tiempo flotante abajo, selector de zona arriba. */
  :root {
    --bg: #eef2f5;
    --panel: rgba(255, 255, 255, 0.94);
    --fg: #14232e;
    --muted: #5b6b77;
    --line: #cfd9e0;
    --accent: #0a6fb8;
    --forecast: #b5500b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --panel: rgba(18, 30, 39, 0.94);
      --fg: #e6eef3;
      --muted: #93a5b2;
      --line: #2b3d49;
      --accent: #5cb6f0;
      --forecast: #f0a060;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  #map { position: absolute; inset: 0; }
  .leaflet-container { background: var(--bg); font-family: var(--font); }

  .top, .bottom {
    position: absolute; z-index: 1000;
    left: max(12px, env(safe-area-inset-left, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .top { top: max(12px, env(safe-area-inset-top, 0px)); justify-content: flex-start; flex-wrap: wrap; gap: 8px; }
  .bottom { bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 12px)); }
  .card {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px);
  }
  .top .card { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .top h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  select, button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .time-card { width: min(560px, 100%); display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  #play { width: 40px; height: 36px; padding: 0; font-size: 16px; flex: none; }
  #slider { flex: 1; min-width: 0; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 11ch; text-align: right; }
  #badge {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px;
    border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap;
  }
  #badge.fc { border-color: var(--forecast); color: var(--forecast); }
  #status { color: var(--muted); font-size: 12.5px; min-height: 1.4em; }
  .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
  .legend i { display: inline-block; width: 22px; height: 8px; border-radius: 2px; }
  [hidden] { display: none !important; }
  .cal { display: grid; gap: 4px; }
  .cal label { display: grid; grid-template-columns: 8.5ch 1fr 7ch; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .cal output { font-variant-numeric: tabular-nums; color: var(--fg); text-align: right; }
  .cal input[type="range"] { min-width: 0; accent-color: var(--accent); }
  input[type="password"] { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .leaflet-control-attribution { font-size: 10.5px; }
  @media (prefers-color-scheme: dark) { .base { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.7); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Mapa de radar de lluvia"></div>

<div class="top">
  <div class="card">
    <h1>Radar de lluvia</h1>
    <label for="fuente" style="position:absolute;left:-9999px">Fuente</label>
    <select id="fuente">
      <option value="rv" selected>RainViewer</option>
      <option value="compo">AEMET nacional</option>
      <option value="aemet">AEMET regional (Cáceres)</option>
    </select>
    <label class="sr" for="zona" style="position:absolute;left:-9999px">Zona</label>
    <select id="zona">
      <option value="38.9161,-6.3437" selected>Mérida</option>
      <option value="40.4168,-3.7038">Madrid</option>
      <option value="37.3891,-5.9845">Sevilla</option>
      <option value="39.4699,-0.3763">Valencia</option>
      <option value="41.3874,2.1686">Barcelona</option>
      <option value="43.3623,-8.4115">A Coruña</option>
      <option value="38.7223,-9.1393">Lisboa</option>
    </select>
    <button id="recalc" type="button" title="Recalcular la previsión para la zona que se ve">Previsión aquí</button>
    <button id="keybtn" type="button" hidden>Clave</button>
    <button id="calbtn" type="button" hidden>Ajustar</button>
  </div>
</div>

<div class="bottom">
  <div class="card time-card">
    <div class="row">
      <button id="play" type="button" aria-label="Reproducir">▶</button>
      <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Instante del radar">
      <span id="clock">--:--</span>
    </div>
    <div class="row" style="justify-content:space-between">
      <span id="badge">cargando</span>
      <span class="legend" id="legend"><i style="background:linear-gradient(90deg,#8ad1ff,#2f7ed8,#f5d000,#e8341c,#b10fb0)"></i>débil → intensa</span>
    </div>
    <div class="row" id="keyrow" hidden>
      <input id="aemetkey" type="password" autocomplete="off" placeholder="API key de AEMET (solo en este navegador)" style="flex:1;min-width:0" aria-label="API key de AEMET">
      <input id="radarcode" type="text" autocomplete="off" maxlength="6" size="4" aria-label="Código de radar" title="Código del radar regional (cc = Cáceres)" style="width:5ch;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px">
      <button id="savekey" type="button">Guardar</button>
    </div>
    <div class="cal" id="calrow" hidden>
      <label>Este–Oeste <input id="cal-dx" type="range" min="-60" max="60" step="1"><output id="o-dx"></output></label>
      <label>Norte–Sur <input id="cal-dy" type="range" min="-60" max="60" step="1"><output id="o-dy"></output></label>
      <label>Tamaño <input id="cal-s" type="range" min="60" max="140" step="1"><output id="o-s"></output></label>
      <label>Opacidad <input id="cal-op" type="range" min="20" max="100" step="5"><output id="o-op"></output></label>
      <div class="row" style="justify-content:space-between"><span id="calout" style="color:var(--muted);font-size:12px"></span><button id="calreset" type="button">Restablecer</button></div>
    </div>
    <div id="status" role="status">Cargando radar…</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  'use strict';

  // ---- Configuración ----
  const API = 'https://api.rainviewer.com/public/weather-maps.json';
  const COLOR = 2, SMOOTH = 1, SNOW = 1;      // esquema de color y opciones de tile de RainViewer
  const FZ = 7, FN = 2 ** FZ, FSPAN = 1;      // bloque de previsión: 3x3 tiles a zoom 7
  const DS = 4, RSEARCH = 12;                 // submuestreo y radio de búsqueda del movimiento (celdas)
  const FORECAST_STEPS = 3;                   // 3 pasos de 10 min = +30 min
  const STEP_S = 600;
  const FRAME_MS = 650;

  // AEMET: radar regional, pedido directamente desde el navegador con tu clave (se guarda solo en localStorage).
  const AEMET_API = 'https://opendata.aemet.es/opendata/api/red/radar/regional/';
  const AEMET_DEFAULT_RADAR = 'cc';              // Cáceres
  const AEMET_CENTER = [39.5, -6.4];             // PROVISIONAL: posición de la antena, hay que calibrarla
  const AEMET_CREDIT = 'Radar © <a href="https://www.aemet.es">AEMET</a>';
  const AEMET_RADIUS_KM = 240;                   // PROVISIONAL: radio que cubre la imagen

  // AEMET nacional: archivo con 24 GeoTIFF (10 min). Se pide directo y, si el navegador lo bloquea, por el Worker.
  const COMPO_DIRECT = 'https://www.aemet.es/es/api-eltiempo/radar/download/compo';
  const COMPO_WORKER = 'https://radar-aemet-proxy.eusebio-montero.workers.dev/radar/compo';

  const $ = id => document.getElementById(id);
  const map = L.map('map', { zoomControl: false, maxZoom: 10, minZoom: 4 });
  L.control.zoom({ position: 'topright' }).addTo(map);
  const start = $('zona').value.split(',').map(Number);
  map.setView(start, 7);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, className: 'base',
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.attributionControl.addAttribution('Weather data by <a href="https://www.rainviewer.com">Rain Viewer</a>');

  const marker = L.circleMarker(start, { radius: 5, color: '#fff', weight: 2, fillColor: '#0a6fb8', fillOpacity: 1 }).addTo(map);

  // ---- Estado ----
  let host = '', past = [];           // frames pasados de RainViewer
  let layers = [];                    // una capa por instante (pasados + previstos)
  let times = [];                     // segundos UNIX por instante
  let isForecast = [];                // true si el instante es previsión
  let idx = 0, timer = null;

  const fmt = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit' });
  const setStatus = t => { $('status').textContent = t; };

  // ---- Capas ----
  function tileLayerFor(frame) {
    return L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/${COLOR}/${SMOOTH}_${SNOW}.png`, {
      opacity: 0, maxNativeZoom: 10, maxZoom: 10, tileSize: 256, updateWhenIdle: true, zIndex: 10
    });
  }

  let mode = 'rv';                    // 'rv' | 'compo' | 'aemet'
  // Conjunto de imágenes activo (RainViewer o AEMET nacional): n imágenes, sus horas y cómo mostrar la i-ésima.
  const cur = () => (mode === 'compo'
    ? { n: compo.frames.length, times: compo.times, fc: [], label: 'AEMET', apply: i => compo.show(i) }
    : { n: layers.length, times, fc: isForecast, label: 'observado',
        apply: i => layers.forEach((l, k) => l.setOpacity(k === i ? 0.75 : 0)) });

  function show(i) {
    const S = cur();
    idx = i;
    S.apply(i);
    $('slider').value = i;
    $('clock').textContent = fmt.format(new Date(S.times[i] * 1000));
    const b = $('badge');
    b.textContent = S.fc[i] ? 'previsión' : S.label;
    b.classList.toggle('fc', !!S.fc[i]);
  }

  function play() {
    if (timer) return pause();
    if (idx >= cur().n - 1) show(0);
    $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', 'Pausar');
    timer = setInterval(() => {
      if (idx >= cur().n - 1) return pause();
      show(idx + 1);
    }, FRAME_MS);
  }
  function pause() {
    clearInterval(timer); timer = null;
    $('play').textContent = '▶'; $('play').setAttribute('aria-label', 'Reproducir');
  }

  // ---- Previsión: desplazamiento uniforme estimado entre dos frames ----
  const lonOf = x => x / FN * 360 - 180;
  const latOf = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / FN))) * 180 / Math.PI;
  const tileXY = (lat, lon) => {
    const r = lat * Math.PI / 180;
    return [Math.floor((lon + 180) / 360 * FN), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * FN)];
  };

  function loadTile(frame, x, y) {
    return new Promise(res => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = `${host}${frame.path}/256/${FZ}/${x}/${y}/${COLOR}/${SMOOTH}_${SNOW}.png`;
    });
  }

  async function stitch(frame, cx, cy) {
    const size = 256 * (2 * FSPAN + 1);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d', { willReadFrequently: true });
    const jobs = [];
    for (let dy = -FSPAN; dy <= FSPAN; dy++)
      for (let dx = -FSPAN; dx <= FSPAN; dx++)
        jobs.push(loadTile(frame, cx + dx, cy + dy).then(im => ({ im, dx, dy })));
    const got = await Promise.all(jobs);
    if (!got.some(t => t.im)) throw new Error('sin tiles');
    got.forEach(t => { if (t.im) g.drawImage(t.im, (t.dx + FSPAN) * 256, (t.dy + FSPAN) * 256); });
    return c;
  }

  function intensity(canvas) {
    const s = canvas.width, n = s / DS;
    const d = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, s, s).data; // lanza SecurityError si el canvas está contaminado
    const out = new Float32Array(n * n);
    for (let cy = 0; cy < n; cy++) for (let cx = 0; cx < n; cx++) {
      let sum = 0;
      for (let y = 0; y < DS; y++) for (let x = 0; x < DS; x++) sum += d[(((cy * DS + y) * s) + cx * DS + x) * 4 + 3];
      out[cy * n + cx] = sum / (DS * DS * 255);
    }
    return out;
  }

  // Desplazamiento (celdas) que lleva el campo A al campo B: mínimo de la diferencia media absoluta.
  function bestShift(A, B, n) {
    let best = null, rain = 0;
    for (let i = 0; i < A.length; i++) rain += A[i] > 0.1 ? 1 : 0;
    if (rain / A.length < 0.004) return { none: true };
    for (let dy = -RSEARCH; dy <= RSEARCH; dy++) for (let dx = -RSEARCH; dx <= RSEARCH; dx++) {
      let sum = 0, cnt = 0;
      const y0 = Math.max(0, -dy), y1 = Math.min(n, n - dy), x0 = Math.max(0, -dx), x1 = Math.min(n, n - dx);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        sum += Math.abs(A[y * n + x] - B[(y + dy) * n + x + dx]); cnt++;
      }
      if (cnt < n * n * 0.4) continue;
      const score = sum / cnt;
      if (!best || score < best.score) best = { dx, dy, score };
    }
    return best;
  }

  const compass = deg => ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
  let fcLayers = [];

  async function buildForecast() {
    fcLayers.forEach(l => map.removeLayer(l)); fcLayers = [];
    layers.length = past.length; times.length = past.length; isForecast.length = past.length;
    $('slider').max = past.length - 1;
    if (idx > past.length - 1) show(past.length - 1);

    const c = map.getCenter();
    const [cx, cy] = tileXY(c.lat, c.lng);
    const a = past[past.length - 3], b = past[past.length - 1];
    setStatus('Calculando previsión…');
    try {
      const [ca, cb] = await Promise.all([stitch(a, cx, cy), stitch(b, cx, cy)]);
      const n = ca.width / DS;
      const mv = bestShift(intensity(ca), intensity(cb), n);
      if (mv.none) { setStatus('Sin lluvia significativa en esta zona. No hay previsión.'); return; }
      const dt = b.time - a.time;
      const vx = mv.dx * DS / dt, vy = mv.dy * DS / dt;           // píxeles por segundo
      const mpp = 156543.03 * Math.cos(c.lat * Math.PI / 180) / FN; // metros por píxel
      const kmh = Math.hypot(vx, vy) * mpp * 3.6;
      const heading = Math.atan2(vx, -vy) * 180 / Math.PI;

      const nw = L.latLng(latOf(cy - FSPAN), lonOf(cx - FSPAN));
      const se = L.latLng(latOf(cy + FSPAN + 1), lonOf(cx + FSPAN + 1));
      for (let k = 1; k <= FORECAST_STEPS; k++) {
        const o = document.createElement('canvas'); o.width = o.height = cb.width;
        o.getContext('2d').drawImage(cb, Math.round(vx * STEP_S * k), Math.round(vy * STEP_S * k));
        const ov = L.imageOverlay(o.toDataURL('image/png'), L.latLngBounds(nw, se), { opacity: 0, zIndex: 11, interactive: false }).addTo(map);
        fcLayers.push(ov);
        layers.push(ov); times.push(b.time + STEP_S * k); isForecast.push(true);
      }
      $('slider').max = layers.length - 1;
      setStatus(`Previsión experimental: la lluvia se mueve hacia el ${compass(heading)} a unos ${Math.round(kmh)} km/h. Cubre el área de 3×3 tiles alrededor del centro del mapa.`);
    } catch (e) {
      setStatus('No se pudo calcular la previsión (el servidor de tiles no permite leer los píxeles). Se muestra solo lo observado.');
      console.warn('previsión:', e);
    }
  }

  // ---- Fuente AEMET (radar regional) ----
  let aemetOverlay = null, aemetRing = null, aemetUrl = null;
  const store = {
    get: k => { try { return (localStorage.getItem(k) || '').trim(); } catch { return ''; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };
  const getRadar = () => store.get('aemet_radar') || AEMET_DEFAULT_RADAR;

  // Calibración ajustable (se guarda en este navegador): desplazamiento E-O y N-S en km, tamaño en % y opacidad en %.
  const CAL_DEFAULT = { dx: 8, dy: -12, s: 100, op: 75 };   // valores calibrados a mano sobre la frontera con Portugal
  let cal = { ...CAL_DEFAULT };
  try { Object.assign(cal, JSON.parse(localStorage.getItem('aemet_cal') || '{}')); } catch {}
  let aemetNat = [1, 1];
  const KM_DEG = 111.19;

  function aemetCenter() {
    const lat = AEMET_CENTER[0] + cal.dy / KM_DEG;
    return [lat, AEMET_CENTER[1] + cal.dx / (KM_DEG * Math.cos(AEMET_CENTER[0] * Math.PI / 180))];
  }
  // El GIF mide 480x530 px: el disco de radar (240 km de radio) ocupa todo el ancho, así que 1 px ~ 1 km,
  // y los ~50 px sobrantes son la cabecera y la escala de colores, que quedan por debajo del borde norte.
  let aemetImg = null;
  function aemetGeom() {
    const [lat0, lon0] = aemetCenter();
    const R = AEMET_RADIUS_KM * cal.s / 100;
    const [w, h] = aemetNat;
    const halfLon = R / (KM_DEG * Math.cos(lat0 * Math.PI / 180));
    const north = lat0 + R / KM_DEG;
    const south = north - (h * (2 * R / w)) / KM_DEG;
    return { north, south, west: lon0 - halfLon, east: lon0 + halfLon };
  }
  // Leaflet estira la imagen en el plano Mercator; la de AEMET es lineal en kilómetros (latitud). Se remuestrean las filas.
  function mercatorCanvas(img, g) {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
    const yN = merc(g.north), yS = merc(g.south);
    const outH = Math.max(2, Math.round(h * (yN - yS) / ((g.north - g.south) * Math.PI / 180)));
    const c = document.createElement('canvas'); c.width = w; c.height = outH;
    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    for (let j = 0; j < outH; j++) {
      const lat = (2 * Math.atan(Math.exp(yN - (j + 0.5) / outH * (yN - yS))) - Math.PI / 2) * 180 / Math.PI;
      const row = Math.min(h - 1, Math.max(0, Math.floor((g.north - lat) / (g.north - g.south) * h)));
      ctx.drawImage(img, 0, row, w, 1, 0, j, w, 1);
    }
    return c;
  }
  const geomBounds = g => L.latLngBounds([g.south, g.west], [g.north, g.east]);
  function applyCal(save = true) {
    const R = AEMET_RADIUS_KM * cal.s / 100;
    if (aemetOverlay && aemetImg) {
      const g = aemetGeom();
      aemetOverlay.setUrl(mercatorCanvas(aemetImg, g).toDataURL('image/png'));
      aemetOverlay.setBounds(geomBounds(g));
      aemetOverlay.setOpacity(cal.op / 100);
    }
    if (aemetRing) { aemetRing.setLatLng(aemetCenter()); aemetRing.setRadius(R * 1000); }
    const sgn = v => (v > 0 ? '+' : '') + v;
    $('o-dx').textContent = sgn(cal.dx) + ' km'; $('o-dy').textContent = sgn(cal.dy) + ' km';
    $('o-s').textContent = cal.s + ' %'; $('o-op').textContent = cal.op + ' %';
    $('calout').textContent = `E-O ${sgn(cal.dx)} · N-S ${sgn(cal.dy)} · tamaño ${cal.s} %`;
    $('cal-dx').value = cal.dx; $('cal-dy').value = cal.dy; $('cal-s').value = cal.s; $('cal-op').value = cal.op;
    if (save) { try { localStorage.setItem('aemet_cal', JSON.stringify(cal)); } catch {} }
  }
  function loadImage(url) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('el navegador no pudo leer la imagen de AEMET'));
      im.src = url;
    });
  }

  async function aemetFetch(key, radar) {
    let r;
    try { r = await fetch(`${AEMET_API}${encodeURIComponent(radar)}/?api_key=${encodeURIComponent(key)}`); }
    catch { throw new Error('el navegador no pudo conectar con AEMET (CORS o red)'); }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (j.estado !== 200 || !j.datos) throw new Error(`AEMET respondió ${j.estado}: ${j.descripcion || 'sin detalle'} (radar "${radar}")`);
    let img;
    try { img = await fetch(j.datos); } catch { throw new Error('el navegador no pudo descargar la imagen (CORS o red)'); }
    if (!img.ok) throw new Error(`imagen HTTP ${img.status}`);
    return img.blob();
  }

  // Algunos servidores devuelven la imagen sin tipo MIME: se reconoce por su cabecera.
  async function asImage(blob) {
    if (blob.type.startsWith('image/')) return blob;
    const h = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
    const sig = (h[0] === 0x47 && h[1] === 0x49 && h[2] === 0x46) ? 'image/gif'
      : (h[0] === 0x89 && h[1] === 0x50) ? 'image/png'
      : (h[0] === 0xff && h[1] === 0xd8) ? 'image/jpeg' : '';
    if (!sig) throw new Error(`la respuesta no es una imagen (tipo: ${blob.type || 'desconocido'}, ${blob.size} bytes)`);
    return new Blob([blob], { type: sig });
  }

  function clearAemet() {
    map.attributionControl.removeAttribution(AEMET_CREDIT);
    if (aemetOverlay) { map.removeLayer(aemetOverlay); aemetOverlay = null; }
    if (aemetRing) { map.removeLayer(aemetRing); aemetRing = null; }
  }

  function showRainviewer() {
    mode = 'rv';
    clearAemet();
    compo.hide();
    $('play').hidden = $('slider').hidden = $('recalc').hidden = false;
    $('legend').hidden = false;
    $('keybtn').hidden = $('keyrow').hidden = $('calbtn').hidden = $('calrow').hidden = true;
    $('slider').max = Math.max(0, layers.length - 1);
    if (layers.length) show(Math.min(idx, layers.length - 1));
    setStatus('RainViewer: pulsa ▶ para ver la animación.');
  }

  async function showAemet() {
    pause();
    mode = 'aemet';
    layers.forEach(l => l.setOpacity(0));
    compo.hide();
    $('legend').hidden = true;
    $('play').hidden = $('slider').hidden = $('recalc').hidden = true;
    $('keybtn').hidden = false; $('calbtn').hidden = false;
    const b = $('badge'); b.textContent = 'AEMET'; b.classList.remove('fc');
    $('clock').textContent = '--:--';
    const key = store.get('aemet_key'), radar = getRadar();
    $('radarcode').value = radar;
    if (!key) {
      $('fuente').value = 'rv'; showRainviewer();
      $('keybtn').hidden = false; $('keyrow').hidden = false;
      setStatus('Para usar AEMET guarda tu API key con el botón Clave. Se vuelve a RainViewer.');
      return;
    }
    setStatus(`Descargando radar "${radar}" de AEMET…`);
    try {
      const blob = await asImage(await aemetFetch(key, radar));
      if (aemetUrl) URL.revokeObjectURL(aemetUrl);
      aemetUrl = URL.createObjectURL(blob);
      clearAemet();
      aemetImg = await loadImage(aemetUrl);
      const nw = aemetImg.naturalWidth, nh = aemetImg.naturalHeight;
      aemetNat = [nw, nh];
      const g = aemetGeom(), bd = geomBounds(g);
      aemetOverlay = L.imageOverlay(mercatorCanvas(aemetImg, g).toDataURL('image/png'), bd, { opacity: cal.op / 100, zIndex: 10, interactive: false }).addTo(map);
      aemetOverlay.on('error', () => setStatus(`El navegador no pudo leer la imagen de AEMET (tipo: ${blob.type}, ${blob.size} bytes).`));
      aemetRing = L.circle(aemetCenter(), { radius: AEMET_RADIUS_KM * cal.s / 100 * 1000, color: '#e8341c', weight: 1.5, dashArray: '6 6', fill: false, interactive: false }).addTo(map);
      map.fitBounds(bd);
      applyCal(false);
      map.attributionControl.addAttribution(AEMET_CREDIT);
      $('clock').textContent = fmt.format(new Date());
      setStatus(`Radar regional "${radar}" de AEMET (imagen de ${nw}×${nh} px, descargada a la hora indicada; una nueva cada 10 min). Usa Ajustar para alinear la frontera amarilla con la real.`);
    } catch (e) {
      console.warn('AEMET:', e);
      $('fuente').value = 'rv';
      showRainviewer();
      $('keybtn').hidden = false;
      setStatus(`AEMET no disponible: ${e.message}. Se vuelve a RainViewer.`);
    }
  }

  // ---- Fuente AEMET nacional (GeoTIFF en EPSG:4326, 24 imágenes de 10 min) ----
  // <parse>
  async function gunzipIfNeeded(bytes) {
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return bytes;   // el navegador ya la descomprimió (Content-Encoding)
  }

  function untar(bytes) {
    const files = [], dec = new TextDecoder();
    let off = 0;
    while (off + 512 <= bytes.length) {
      const head = bytes.subarray(off, off + 512);
      if (head.every(b => b === 0)) break;
      const name = dec.decode(head.subarray(0, 100)).replace(/\0.*$/s, '');
      const size = parseInt(dec.decode(head.subarray(124, 136)), 8) || 0;
      const type = String.fromCharCode(head[156]);
      off += 512;
      if ((type === '0' || type === '\0') && size > 0) files.push({ name, data: bytes.subarray(off, off + size) });
      off += Math.ceil(size / 512) * 512;
    }
    return files;
  }

  // TIFF de 8 bits con paleta, sin compresión, con etiquetas GeoTIFF de escala y punto de enlace.
  function parseTiff(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const le = dv.getUint16(0) === 0x4949;
    if (dv.getUint16(2, le) !== 42) throw new Error('no es un TIFF');
    const ifd = dv.getUint32(4, le), n = dv.getUint16(ifd, le), tags = {};
    const sz = { 1: 1, 2: 1, 3: 2, 4: 4, 12: 8 };
    for (let i = 0; i < n; i++) {
      const e = ifd + 2 + i * 12, tag = dv.getUint16(e, le), type = dv.getUint16(e + 2, le), count = dv.getUint32(e + 4, le);
      if (type === 2) continue;   // texto: no hace falta
      const p = (sz[type] || 1) * count <= 4 ? e + 8 : dv.getUint32(e + 8, le);
      const v = [];
      for (let k = 0; k < count; k++) {
        if (type === 1) v.push(dv.getUint8(p + k));
        else if (type === 3) v.push(dv.getUint16(p + k * 2, le));
        else if (type === 4) v.push(dv.getUint32(p + k * 4, le));
        else if (type === 12) v.push(dv.getFloat64(p + k * 8, le));
      }
      tags[tag] = v;
    }
    const w = tags[256][0], h = tags[257][0];
    if ((tags[259] || [1])[0] !== 1 || tags[258][0] !== 8 || tags[262][0] !== 3) throw new Error('formato TIFF no soportado');
    const sc = tags[33550], tp = tags[33922];
    if (!sc || !tp) throw new Error('el TIFF no está georreferenciado');
    const offs = tags[273], cnts = tags[279], idxs = new Uint8Array(w * h);
    let o = 0;
    for (let s = 0; s < offs.length && o < idxs.length; s++) {
      idxs.set(bytes.subarray(offs[s], offs[s] + cnts[s]).subarray(0, idxs.length - o), o);
      o += cnts[s];
    }
    const cm = tags[320], pal = new Uint8Array(256 * 3);   // R, G y B en planos de 16 bits
    for (let i = 0; i < 256; i++) { pal[i * 3] = cm[i] >> 8; pal[i * 3 + 1] = cm[256 + i] >> 8; pal[i * 3 + 2] = cm[512 + i] >> 8; }
    const west = tp[3] - tp[0] * sc[0], north = tp[4] + tp[1] * sc[1];
    return { w, h, idxs, pal, west, north, east: west + w * sc[0], south: north - h * sc[1] };
  }

  // Clase 0 = transparente (índice 0: dentro de cobertura sin eco; índice 1: fuera de cobertura);
  // del 2 en adelante, ecos con el color de la paleta (empaquetado como RGBA para escribir en un canvas).
  function toClasses(f) {
    const cls = new Uint8Array(f.idxs.length);
    for (let i = 0; i < cls.length; i++) { const v = f.idxs[i]; cls[i] = v < 2 ? 0 : v; }
    const pal32 = new Uint32Array(256);
    for (let v = 0; v < 256; v++) pal32[v] = (255 << 24 | f.pal[v * 3 + 2] << 16 | f.pal[v * 3 + 1] << 8 | f.pal[v * 3]) >>> 0;
    return { cls, pal32 };
  }
  // </parse>

  // Capa propia: en vez de estirar una imagen de ~3 km por píxel, dibuja un canvas a la resolución de la pantalla.
  // Para cada punto de la pantalla mira los 4 píxeles de radar vecinos y pinta la clase con más peso
  // (interpolación suavizada), así los contornos salen redondeados a cualquier zoom y no hay bloques.
  const compo = {
    frames: [], times: [], geo: null, loadedAt: 0, layer: null,
    clear() { this.hide(); this.frames = []; this.times = []; this.geo = null; },
    show(i) {
      if (!this.layer) this.layer = new CompoLayer();
      if (!map.hasLayer(this.layer)) this.layer.addTo(map);
      this.layer.setFrame(i);
    },
    hide() { if (this.layer && map.hasLayer(this.layer)) map.removeLayer(this.layer); }
  };

  const CompoLayer = L.Layer.extend({
    initialize() { this._i = -1; },
    onAdd(m) {
      const c = this._c = L.DomUtil.create('canvas');
      c.style.pointerEvents = 'none'; c.style.opacity = '0.8';
      m.getPane('overlayPane').appendChild(c);
      m.on('moveend resize', this._reset, this);
      m.on('zoomstart', this._hide, this);
      this._reset();
    },
    onRemove(m) {
      m.off('moveend resize', this._reset, this);
      m.off('zoomstart', this._hide, this);
      L.DomUtil.remove(this._c); this._c = this._img = null;
    },
    setFrame(i) { this._i = i; this._draw(); },
    _hide() { if (this._c) this._c.style.visibility = 'hidden'; },
    // Coloca el canvas (algo más grande que la pantalla para poder arrastrar) y calcula, para cada columna y
    // cada fila, a qué posición del radar corresponde (el eje X solo depende de la longitud y el Y de la latitud).
    _reset() {
      const m = this._map, c = this._c, g = compo.geo;
      if (!c || !g) return;
      const sz = m.getSize(), pad = 0.35;
      const w = Math.round(sz.x * (1 + 2 * pad)), h = Math.round(sz.y * (1 + 2 * pad));
      const ss = (window.devicePixelRatio || 1) >= 2 ? 2 : 1.5;   // sobremuestreo: el navegador lo reduce y suaviza el borde
      const tl = m.containerPointToLayerPoint([-sz.x * pad, -sz.y * pad]).round();
      L.DomUtil.setPosition(c, tl);
      c.style.width = w + 'px'; c.style.height = h + 'px';
      const W = c.width = Math.round(w * ss), H = c.height = Math.round(h * ss);
      const dx = (g.east - g.west) / g.w, dy = (g.north - g.south) / g.h;
      this._xi = new Int32Array(W); this._xf = new Float32Array(W);
      this._yi = new Int32Array(H); this._yf = new Float32Array(H);
      for (let x = 0; x < W; x++) {
        const col = (m.layerPointToLatLng([tl.x + (x + 0.5) / ss, tl.y]).lng - g.west) / dx - 0.5;
        const i = Math.floor(col); this._xi[x] = i; this._xf[x] = col - i;
      }
      for (let y = 0; y < H; y++) {
        const row = (g.north - m.layerPointToLatLng([tl.x, tl.y + (y + 0.5) / ss]).lat) / dy - 0.5;
        const j = Math.floor(row); this._yi[y] = j; this._yf[y] = row - j;
      }
      this._img = c.getContext('2d').createImageData(W, H);
      this._draw();
      c.style.visibility = '';
    },
    _draw() {
      const c = this._c, F = compo.frames[this._i], g = compo.geo;
      if (!c || !g || !this._img) return;
      const img = this._img, W = img.width, H = img.height, out = new Uint32Array(img.data.buffer);
      const xi = this._xi, xf = this._xf, yi = this._yi, yf = this._yf;
      out.fill(0);
      if (F) {
        const cls = F.cls, pal = F.pal32, w = g.w, h = g.h;
        for (let y = 0; y < H; y++) {
          const j = yi[y];
          if (j < -1 || j >= h) continue;
          const fy = yf[y], sy = fy * fy * (3 - 2 * fy);
          const r0 = j >= 0 ? j * w : -1, r1 = j + 1 < h ? (j + 1) * w : -1, row = y * W;
          for (let x = 0; x < W; x++) {
            const i = xi[x];
            if (i < -1 || i >= w) continue;
            const a = r0 >= 0 && i >= 0 ? cls[r0 + i] : 0, b = r0 >= 0 && i + 1 < w ? cls[r0 + i + 1] : 0;
            const e = r1 >= 0 && i >= 0 ? cls[r1 + i] : 0, d = r1 >= 0 && i + 1 < w ? cls[r1 + i + 1] : 0;
            let k;
            if (a === b && b === e && e === d) k = a;
            else {
              const fx = xf[x], sx = fx * fx * (3 - 2 * fx);
              const wa = (1 - sx) * (1 - sy), wb = sx * (1 - sy), wc = (1 - sx) * sy, wd = sx * sy;
              k = a; let s = wa + (b === a ? wb : 0) + (e === a ? wc : 0) + (d === a ? wd : 0);
              const sb = wb + (a === b ? wa : 0) + (e === b ? wc : 0) + (d === b ? wd : 0);
              if (sb > s) { s = sb; k = b; }
              const se = wc + (a === e ? wa : 0) + (b === e ? wb : 0) + (d === e ? wd : 0);
              if (se > s) { s = se; k = e; }
              const sd = wd + (a === d ? wa : 0) + (b === d ? wb : 0) + (e === d ? wc : 0);
              if (sd > s) k = d;
            }
            if (k) out[row + x] = pal[k];
          }
        }
      }
      this._c.getContext('2d').putImageData(img, 0, 0);
    }
  });

  async function fetchCompo() {
    const errs = [];
    for (const [label, url] of [['directo', COMPO_DIRECT], ['Worker', COMPO_WORKER]]) {
      try {
        const r = await fetch(url);
        if (!r.ok) {
          let d = '';
          try { const j = await r.clone().json(); d = ': ' + [j.error, j.status].filter(Boolean).join(' · '); } catch {}
          throw new Error(`HTTP ${r.status}${d}`);
        }
        return new Uint8Array(await r.arrayBuffer());
      } catch (e) {
        errs.push(`${label}: ${e instanceof TypeError ? 'bloqueado o sin conexión (CORS)' : e.message}`);
      }
    }
    throw new Error(errs.join(' | '));
  }

  async function loadCompo() {
    const files = untar(await gunzipIfNeeded(await fetchCompo()))
      .filter(f => /\.tiff?$/i.test(f.name)).sort((a, b) => a.name.localeCompare(b.name));
    if (!files.length) throw new Error('el archivo de AEMET no contiene imágenes');
    compo.clear();
    for (let i = 0; i < files.length; i++) {
      setStatus(`Preparando imágenes de AEMET… ${i + 1}/${files.length}`);
      await new Promise(r => setTimeout(r));   // deja respirar a la página
      const g = parseTiff(files[i].data);
      if (!compo.geo) compo.geo = { w: g.w, h: g.h, west: g.west, north: g.north, east: g.east, south: g.south };
      else if (g.w !== compo.geo.w || g.h !== compo.geo.h) throw new Error('las imágenes de AEMET no tienen el mismo tamaño');
      const m = /radw(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(files[i].name);
      compo.times.push(m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) / 1000 : Date.now() / 1000 - (files.length - 1 - i) * 600);
      compo.frames.push(toClasses(g));
    }
    compo.loadedAt = Date.now();
  }

  async function showCompo() {
    pause();
    mode = 'compo';
    clearAemet();
    layers.forEach(l => l.setOpacity(0));
    $('play').hidden = $('slider').hidden = false;
    $('recalc').hidden = $('keybtn').hidden = $('keyrow').hidden = $('calbtn').hidden = $('calrow').hidden = true;
    $('legend').hidden = true;
    try {
      if (!compo.frames.length || Date.now() - compo.loadedAt > 10 * 60e3) {
        $('clock').textContent = '--:--';
        setStatus('Descargando la composición nacional de AEMET…');
        await loadCompo();
      }
      if (mode !== 'compo') return;   // el usuario cambió de fuente mientras se descargaba
      $('slider').max = compo.frames.length - 1;
      show(compo.frames.length - 1);
      map.attributionControl.addAttribution(AEMET_CREDIT);
      setStatus(`Composición nacional de AEMET: ${compo.frames.length} imágenes, una cada 10 min. Pulsa ▶ para animarlas.`);
    } catch (e) {
      console.warn('AEMET nacional:', e);
      compo.clear();
      $('fuente').value = 'rv';
      showRainviewer();
      setStatus(`AEMET nacional no disponible: ${e.message}. Se vuelve a RainViewer.`);
    }
  }

  // ---- Arranque ----
  async function init() {
    try {
      const r = await fetch(API, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      host = j.host; past = (j.radar && j.radar.past) || [];
      if (past.length < 3) throw new Error('pocos frames');
    } catch (e) {
      setStatus('No se pudo cargar el radar de RainViewer. Revisa la conexión y recarga.');
      return;
    }
    layers = past.map(f => tileLayerFor(f).addTo(map));
    times = past.map(f => f.time);
    isForecast = past.map(() => false);
    $('slider').max = layers.length - 1;
    show(layers.length - 1);
    setStatus('Radar cargado. Pulsa ▶ para ver la última hora y media.');
    await buildForecast();
    $('slider').max = layers.length - 1;
  }

  $('calbtn').addEventListener('click', () => { $('calrow').hidden = !$('calrow').hidden; applyCal(false); });
  [['dx', 'cal-dx'], ['dy', 'cal-dy'], ['s', 'cal-s'], ['op', 'cal-op']].forEach(([k, id]) =>
    $(id).addEventListener('input', e => { cal[k] = +e.target.value; applyCal(); }));
  $('calreset').addEventListener('click', () => { cal = { ...CAL_DEFAULT }; applyCal(); });
  applyCal(false);
  $('keybtn').addEventListener('click', () => { $('radarcode').value = getRadar(); $('keyrow').hidden = !$('keyrow').hidden; });
  $('savekey').addEventListener('click', () => {
    const v = $('aemetkey').value.trim(), rc = $('radarcode').value.trim().toLowerCase();
    if (rc) store.set('aemet_radar', rc);
    if (v) store.set('aemet_key', v);
    if (!store.get('aemet_key')) return;
    $('aemetkey').value = ''; $('keyrow').hidden = true;
    $('fuente').value = 'aemet'; showAemet();
  });
  $('fuente').addEventListener('change', e => ({ aemet: showAemet, compo: showCompo }[e.target.value] || showRainviewer)());
  $('play').addEventListener('click', play);
  $('slider').addEventListener('input', e => { pause(); show(+e.target.value); });
  $('zona').addEventListener('change', e => {
    const p = e.target.value.split(',').map(Number);
    map.setView(p, 7); marker.setLatLng(p);
    if (past.length && $('fuente').value === 'rv') map.once('moveend', () => { pause(); buildForecast().then(() => show(layers.length - 1)); });
  });
  $('recalc').addEventListener('click', () => { pause(); buildForecast().then(() => show(layers.length - 1)); });

  init();
})();
</script>
