<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de lluvia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Layout: mapa a pantalla completa, panel de tiempo flotante abajo, selector de zona arriba. */
  :root {
    --bg: #eef2f5;
    --panel: rgba(255, 255, 255, 0.94);
    --fg: #14232e;
    --muted: #5b6b77;
    --line: #cfd9e0;
    --accent: #0a6fb8;
    --forecast: #b5500b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --panel: rgba(18, 30, 39, 0.94);
      --fg: #e6eef3;
      --muted: #93a5b2;
      --line: #2b3d49;
      --accent: #5cb6f0;
      --forecast: #f0a060;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
  #map { position: absolute; inset: 0; }
  .leaflet-container { background: var(--bg); font-family: var(--font); }

  .top, .bottom {
    position: absolute; z-index: 1000;
    left: max(12px, env(safe-area-inset-left, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .top { top: max(12px, env(safe-area-inset-top, 0px)); justify-content: flex-start; flex-wrap: wrap; gap: 8px; }
  .bottom { bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 12px)); }
  .card {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px);
  }
  .top .card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; max-width: 100%; }
  .top h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  select, button {
    font: inherit; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .time-card { width: min(560px, 100%); display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .sr { position: absolute; left: -9999px; }
  #play { width: 40px; height: 36px; padding: 0; font-size: 16px; flex: none; }
  #slider { flex: 1; min-width: 0; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 11ch; text-align: right; }
  #badge {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px;
    border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap;
  }
  #badge.fc { border-color: var(--forecast); color: var(--forecast); }
  /* Marco del mapa mientras se muestra un instante previsto */
  #map.fc::after { content: ''; position: absolute; inset: 0; z-index: 700; pointer-events: none;
    border: 5px solid var(--forecast); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), inset 0 0 24px rgba(181, 80, 11, 0.35); }
  #status { color: var(--muted); font-size: 12.5px; min-height: 1.4em; }
  .aemet-legend { display: flex; align-items: flex-start; gap: 0; font-size: 10.5px; color: var(--muted); }
  .aemet-legend b { font-weight: 500; padding-right: 6px; padding-top: 0; }
  .aemet-legend div { flex: 1; min-width: 0; }
  .aemet-legend i { display: block; height: 8px; }
  .aemet-legend span { display: block; padding-top: 1px; font-variant-numeric: tabular-nums; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg); width: min(420px, 92vw); padding: 16px 18px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  dialog p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  dialog ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
  dialog li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  dialog li:last-child { border-bottom: 0; padding-bottom: 0; }
  dialog li strong { font-weight: 650; }
  dialog li span { color: var(--muted); font-size: 12.5px; }
  dialog form { text-align: right; }
  [hidden] { display: none !important; }
  .leaflet-control-attribution { font-size: 10.5px; }
  /* En pantallas estrechas el panel inferior taparía la atribución: se sube por encima (JS rellena --panel-h). */
  @media (max-width: 700px) { .leaflet-bottom { bottom: var(--panel-h, 0px); } }
  @media (prefers-color-scheme: dark) { .base { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.7); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Mapa de radar de lluvia"></div>

<div class="top">
  <div class="card">
    <h1>Radar de lluvia</h1>
    <label class="sr" for="zona">Zona</label>
    <select id="zona">
      <option value="38.9161,-6.3437" selected>Mérida</option>
      <option value="40.4168,-3.7038">Madrid</option>
      <option value="37.3891,-5.9845">Sevilla</option>
      <option value="39.4699,-0.3763">Valencia</option>
      <option value="41.3874,2.1686">Barcelona</option>
      <option value="43.3623,-8.4115">A Coruña</option>
      <option value="38.7223,-9.1393">Lisboa</option>
    </select>
    <button id="cobbtn" type="button" title="Radares que cubren la zona">Cobertura</button>
  </div>
</div>

<div class="bottom">
  <div class="card time-card">
    <div class="row">
      <button id="play" type="button" aria-label="Reproducir">▶</button>
      <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Instante del radar">
      <span id="clock">--:--</span>
    </div>
    <div class="row"><span id="badge">cargando</span></div>
    <div class="aemet-legend" id="legendAemet" role="img" aria-label="Escala de intensidad de lluvia en mm/h"></div>
    <div id="status" role="status">Cargando radares…</div>
  </div>
</div>

<dialog id="cob" aria-labelledby="cob-t">
  <h2 id="cob-t">Cobertura</h2>
  <p id="cob-zona"></p>
  <ul id="cob-lista"></ul>
  <form method="dialog"><button>Aceptar</button></form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  'use strict';

  // ---- Configuración ----
  // PNG ya reducidos (≈500 m por píxel) que publica el workflow de GitHub Actions en la rama "datos".
  const DATA_URL = 'https://raw.githubusercontent.com/EusebioMontero/my_radar_lluvia/datos/';
  const RADIO_KM = 240;                          // alcance de cada radar regional
  const MAX_RADARES = 8;                         // máximo de radares en memoria a la vez
  const PAGE_FRAMES = 12;                        // imágenes por radar (2 h)
  const MAX_EDAD_S = 15 * 60;                    // un radar sin imagen nueva en 15 min no se pinta en ese instante
  const FRAME_MS = 650;                          // velocidad de la animación
  const REFRESCO_MS = 5 * 60e3, REINTENTO_MS = 30e3;
  const BLK = 8, RSEARCH = 12;                   // previsión: píxeles del dato por celda de análisis (≈4 km) y radio de búsqueda (celdas)
  const STEP_S = 600, MIN_STEPS = 3, MAX_STEPS = 8;   // la previsión avanza de 10 en 10 min hasta 30 min después de «ahora» (entre 3 y 8 pasos)
  const MAX_EDAD_PREV_S = 90 * 60;               // con la última imagen más antigua que esto no se calcula previsión
  const CREDIT = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Información elaborada utilizando, entre otras, la obtenida de la <a href="https://www.aemet.es">Agencia Estatal de Meteorología</a>';
  // Escala de reflectividad de AEMET (dBZ) y color de cada tramo; la leyenda en mm/h sale de la relación Z = 200·R^1,6.
  const ESCALA = [[12, [0, 0, 252]], [18, [0, 148, 252]], [24, [0, 252, 252]], [30, [67, 131, 35]], [36, [0, 192, 0]], [42, [0, 255, 0]],
                  [48, [255, 255, 0]], [54, [255, 187, 0]], [60, [255, 127, 0]], [66, [255, 0, 0]], [72, [200, 0, 90]]];

  const $ = id => document.getElementById(id);
  const map = L.map('map', { zoomControl: false, maxZoom: 14, minZoom: 5 });
  L.control.zoom({ position: 'topright' }).addTo(map);
  const start = $('zona').value.split(',').map(Number);
  map.setView(start, 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'base', attribution: CREDIT }).addTo(map);
  const marker = L.circleMarker(start, { radius: 5, color: '#fff', weight: 2, fillColor: '#0a6fb8', fillOpacity: 1 }).addTo(map);

  const fmt = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit' });
  const setStatus = t => { $('status').textContent = t; };
  const km = (la1, lo1, la2, lo2) => {
    const r = x => x * Math.PI / 180, h = Math.sin(r(la2 - la1) / 2) ** 2 + Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(r(lo2 - lo1) / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  };
  const hace = s => { const m = Math.max(0, Math.round((Date.now() / 1000 - s) / 60)); return m < 120 ? `hace ${m} min` : `hace ${Math.round(m / 60)} h`; };
  const compass = deg => ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

  // Capa de radar propia: en vez de estirar una imagen, dibuja un canvas a la resolución de la pantalla.
  // Para cada punto mira los 4 píxeles de radar vecinos y pinta la clase con más peso (pesos suavizados), así los
  // contornos salen redondeados a cualquier zoom. Con varios radares, en cada punto gana la clase más alta.
  // Un "tile" es { cls, pal32, geo: { w, h, west, north, dx, dy } }: clase por píxel, su paleta y su rejilla en grados.
  const RadarLayer = L.Layer.extend({
    initialize() { this._tiles = []; },
    onAdd(m) {
      const c = this._c = L.DomUtil.create('canvas');
      c.style.pointerEvents = 'none'; c.style.opacity = '0.8';
      m.getPane('overlayPane').appendChild(c);
      m.on('moveend resize', this._reset, this);
      m.on('zoomstart', this._hide, this);
      this._reset();
    },
    onRemove(m) {
      m.off('moveend resize', this._reset, this);
      m.off('zoomstart', this._hide, this);
      L.DomUtil.remove(this._c); this._c = this._img = null;
    },
    setTiles(t) { this._tiles = t; this._draw(); },
    _hide() { if (this._c) this._c.style.visibility = 'hidden'; },
    // Coloca el canvas (algo más grande que la pantalla para poder arrastrar) y calcula la longitud de cada columna y
    // la latitud de cada fila (el eje X solo depende de la longitud y el Y de la latitud).
    _reset() {
      const m = this._map, c = this._c;
      if (!c) return;
      const sz = m.getSize(), pad = 0.35;
      const w = Math.round(sz.x * (1 + 2 * pad)), h = Math.round(sz.y * (1 + 2 * pad));
      const ss = (window.devicePixelRatio || 1) >= 2 ? 2 : 1.5;   // sobremuestreo: el navegador lo reduce y suaviza el borde
      const tl = m.containerPointToLayerPoint([-sz.x * pad, -sz.y * pad]).round();
      L.DomUtil.setPosition(c, tl);
      c.style.width = w + 'px'; c.style.height = h + 'px';
      const W = c.width = Math.round(w * ss), H = c.height = Math.round(h * ss);
      this._lon = new Float64Array(W); this._lat = new Float64Array(H);
      for (let x = 0; x < W; x++) this._lon[x] = m.layerPointToLatLng([tl.x + (x + 0.5) / ss, tl.y]).lng;
      for (let y = 0; y < H; y++) this._lat[y] = m.layerPointToLatLng([tl.x, tl.y + (y + 0.5) / ss]).lat;
      this._xi = new Int32Array(W); this._xf = new Float32Array(W);
      this._yi = new Int32Array(H); this._yf = new Float32Array(H);
      this._best = new Uint8Array(W * H);
      this._img = c.getContext('2d').createImageData(W, H);
      this._draw();
      c.style.visibility = '';
    },
    _draw() {
      const c = this._c;
      if (!c || !this._img) return;
      const img = this._img, out = new Uint32Array(img.data.buffer), best = this._best;
      best.fill(0);
      for (const t of this._tiles) this._paint(t);
      out.fill(0);
      const pal = this._tiles[0] && this._tiles[0].pal32;      // los tiles de un mismo instante comparten paleta
      if (pal) for (let i = 0; i < best.length; i++) if (best[i]) out[i] = pal[best[i]];
      c.getContext('2d').putImageData(img, 0, 0);
    },
    _paint(t) {
      const g = t.geo, cls = t.cls, w = g.w, h = g.h, W = this._img.width, H = this._img.height;
      const xi = this._xi, xf = this._xf, yi = this._yi, yf = this._yf, best = this._best;
      let xa = W, xb = -1, ya = H, yb = -1;
      for (let x = 0; x < W; x++) {
        const col = (this._lon[x] - g.west) / g.dx - 0.5, i = Math.floor(col);
        xi[x] = i; xf[x] = col - i;
        if (i >= -1 && i < w) { if (x < xa) xa = x; xb = x; }
      }
      for (let y = 0; y < H; y++) {
        const row = (g.north - this._lat[y]) / g.dy - 0.5, j = Math.floor(row);
        yi[y] = j; yf[y] = row - j;
        if (j >= -1 && j < h) { if (y < ya) ya = y; yb = y; }
      }
      for (let y = ya; y <= yb; y++) {
        const j = yi[y], fy = yf[y], sy = fy * fy * (3 - 2 * fy);
        const r0 = j >= 0 ? j * w : -1, r1 = j + 1 < h ? (j + 1) * w : -1, row = y * W;
        for (let x = xa; x <= xb; x++) {
          const i = xi[x];
          const a = r0 >= 0 && i >= 0 ? cls[r0 + i] : 0, b = r0 >= 0 && i + 1 < w ? cls[r0 + i + 1] : 0;
          const e = r1 >= 0 && i >= 0 ? cls[r1 + i] : 0, d = r1 >= 0 && i + 1 < w ? cls[r1 + i + 1] : 0;
          let k;
          if (a === b && b === e && e === d) k = a;
          else {
            const fx = xf[x], sx = fx * fx * (3 - 2 * fx);
            const wa = (1 - sx) * (1 - sy), wb = sx * (1 - sy), wc = (1 - sx) * sy, wd = sx * sy;
            k = a; let s = wa + (b === a ? wb : 0) + (e === a ? wc : 0) + (d === a ? wd : 0);
            const sb = wb + (a === b ? wa : 0) + (e === b ? wc : 0) + (d === b ? wd : 0);
            if (sb > s) { s = sb; k = b; }
            const se = wc + (a === e ? wa : 0) + (b === e ? wb : 0) + (d === e ? wd : 0);
            if (se > s) { s = se; k = e; }
            const sd = wd + (a === d ? wa : 0) + (b === d ? wb : 0) + (e === d ? wc : 0);
            if (sd > s) k = d;
          }
          if (k > best[row + x]) best[row + x] = k;
        }
      }
    }
  });


  const radarLayer = {
    layer: null,
    show(tiles) {
      if (!this.layer) this.layer = new RadarLayer();
      if (!map.hasLayer(this.layer)) this.layer.addTo(map);
      this.layer.setTiles(tiles);
    },
    hide() { if (this.layer && map.hasLayer(this.layer)) map.removeLayer(this.layer); }
  };

  // Leyenda en mm/h: AEMET calcula la lluvia a partir de la reflectividad con Z = 200·R^1,6 (Marshall-Palmer).
  const mmh = dbz => 10 ** ((dbz - 10 * Math.log10(200)) / 16);
  const fmtMmh = r => (r < 10 ? r.toFixed(1) : String(Math.round(r)));
  $('legendAemet').innerHTML = '<b>mm/h</b>' + ESCALA.map(([dbz, c]) =>
    `<div title="${dbz} dBZ"><i style="background:rgb(${c})"></i><span>${fmtMmh(mmh(dbz))}</span></div>`).join('');

  // ---- Datos: manifiesto y PNG de cada radar (una clase por píxel) ----
  const rtime = t => Date.UTC(+t.slice(0, 4), +t.slice(4, 6) - 1, +t.slice(6, 8), +t.slice(8, 10), +t.slice(10, 12)) / 1000;

  const rad = {
    manifest: null, loadedAt: 0, origin: null, dx: 0.005, nclases: ESCALA.length,
    radars: {}, timeline: [], fc: null, pv: null, lut: null, pal32: null,
    // Un tile por radar con su imagen más reciente (≤ MAX_EDAD_S) no posterior a T.
    tilesAt(T) {
      const out = [];
      for (const R of Object.values(this.radars)) {
        let best = null;
        for (const [t, cls] of R.frames) { const s = rtime(t); if (s <= T && T - s <= MAX_EDAD_S && (!best || s > best.s)) best = { s, cls }; }
        if (best) out.push({ cls: best.cls, pal32: this.pal32, geo: R.geo });
      }
      return out;
    },
    // Instante k (1..3) de la previsión: la última imagen de cada radar desplazada k·10 min con el movimiento estimado.
    fcTiles(k) {
      const f = this.fc, t = STEP_S * k;
      return this.tilesAt(this.timeline.at(-1)).map(x => ({ ...x, geo: { ...x.geo, west: x.geo.west + f.vlon * t, north: x.geo.north + f.vlat * t } }));
    },
    buildTimeline() {
      const set = new Set();
      for (const R of Object.values(this.radars)) for (const t of R.frames.keys()) set.add(rtime(t));
      this.timeline = [...set].sort((a, b) => a - b).slice(-PAGE_FRAMES);
    }
  };

  async function radManifest() {
    const r = await fetch(DATA_URL + 'manifest.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? 'todavía no hay datos publicados (ejecuta el workflow «Datos de radar AEMET» en la pestaña Actions del repositorio)' : `HTTP ${r.status}`);
    const man = await r.json();
    const rs = Object.values(man.radares || {});
    if (!rs.length) throw new Error('el manifiesto no trae ningún radar');
    rad.manifest = man; rad.loadedAt = Date.now();
    rad.dx = man.pixel_grados || 0.005;
    rad.origin = { west: Math.min(...rs.map(x => x.oeste)), north: Math.max(...rs.map(x => x.norte)) };   // todos los radares comparten la misma rejilla
    const esc = man.escala && man.escala.length ? man.escala.map(e => [e.min, e.rgb]) : ESCALA;
    rad.nclases = esc.length;
    rad.lut = new Map(esc.map(([, c], k) => [(c[0] << 16) | (c[1] << 8) | c[2], k + 1]));
    rad.pal32 = new Uint32Array(256);
    esc.forEach(([, c], k) => { rad.pal32[k + 1] = (255 << 24 | c[2] << 16 | c[1] << 8 | c[0]) >>> 0; });
  }

  // Previsión de pySTEPS que publica el workflow (rejilla de ≈1 km para toda la península): se descarga una vez por cálculo.
  async function radLoadPrev() {
    const p = rad.manifest.prevision;
    if (!p || !p.imagenes || !p.imagenes.length) { rad.pv = null; return; }
    if (rad.pv && rad.pv.base === p.base) return;
    try {
      const frames = await Promise.all(p.imagenes.map(async i => {
        const r = await fetch(DATA_URL + i.f);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return { T: rtime(i.t), cls: await radDecode(await r.blob()) };
      }));
      rad.pv = { base: p.base, metodo: p.metodo, frames,
                 geo: { w: p.ancho, h: p.alto, west: p.oeste, north: p.norte, dx: p.pixel_grados, dy: p.pixel_grados } };
    } catch (e) { console.warn('previsión pySTEPS:', e); rad.pv = null; }
  }

  // Radares cuyo círculo de 240 km llega a lo que se ve (con margen, para la previsión); como mucho MAX_RADARES, los más cercanos al centro.
  function radNeeded() {
    const b = map.getBounds().pad(0.3), c = map.getCenter(), out = [];
    for (const [code, r] of Object.entries(rad.manifest.radares)) {
      const la = Math.min(Math.max(r.lat, b.getSouth()), b.getNorth()), lo = Math.min(Math.max(r.lon, b.getWest()), b.getEast());
      if (km(r.lat, r.lon, la, lo) <= RADIO_KM) out.push([km(r.lat, r.lon, c.lat, c.lng), code]);
    }
    return out.sort((x, y) => x[0] - y[0]).slice(0, MAX_RADARES).map(x => x[1]);
  }

  async function radDecode(blob) {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    const d = g.getImageData(0, 0, c.width, c.height).data, cls = new Uint8Array(c.width * c.height), lut = rad.lut;
    for (let i = 0, o = 0; i < cls.length; i++, o += 4) if (d[o + 3] > 127) cls[i] = lut.get((d[o] << 16) | (d[o + 1] << 8) | d[o + 2]) || 0;
    return cls;
  }

  async function radLoad() {
    const man = rad.manifest;
    await Promise.all(radNeeded().map(async code => {
      const info = man.radares[code], v = info.ventana;
      const R = rad.radars[code] || (rad.radars[code] = { frames: new Map() });
      R.info = info;
      R.geo = { w: info.ancho, h: info.alto, west: info.oeste, north: info.norte, dx: rad.dx, dy: rad.dx,
                gx: Math.round((info.oeste - rad.origin.west) / rad.dx), gy: Math.round((rad.origin.north - info.norte) / rad.dx),
                ell: { cx: v.cx - v.x0, cy: v.cy - v.y0, rx: v.rx, ry: v.ry } };       // círculo de cobertura en píxeles del recorte
      const want = info.imagenes.slice(-PAGE_FRAMES);
      for (const t of [...R.frames.keys()]) if (!want.some(i => i.t === t)) R.frames.delete(t);
      await Promise.all(want.filter(i => !R.frames.has(i.t)).map(async i => {
        try {
          const r = await fetch(DATA_URL + i.f);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          R.frames.set(i.t, await radDecode(await r.blob()));
        } catch (e) { console.warn('radar', code, i.t, e); }
      }));
    }));
    // si el usuario se alejó mucho, se sueltan los radares que ya no se ven para no gastar memoria
    const keep = new Set(radNeeded());
    for (const code of Object.keys(rad.radars)) if (!keep.has(code)) delete rad.radars[code];
  }

  // ---- Previsión: movimiento uniforme de la lluvia entre dos imágenes (correlación por bloques) ----
  // <forecast>
  // Campo de análisis: rejilla de celdas de BLK×BLK píxeles del dato dentro de la caja {gx0, gy0, nx, ny} (índices de la rejilla común).
  // Cada celda vale la media de la clase de lluvia (0..1) del tile que la cubre (si hay varios, gana el mayor); cov marca las celdas con radar.
  function analysisField(tiles, box, ncl) {
    const { gx0, gy0, nx, ny } = box, val = new Float32Array(nx * ny), cov = new Uint8Array(nx * ny), norm = 1 / (BLK * BLK * ncl);
    for (const t of tiles) {
      const g = t.geo, e = g.ell, cls = t.cls, w = g.w;
      const cx0 = Math.max(0, Math.ceil((g.gx - gx0) / BLK)), cx1 = Math.min(nx, Math.floor((g.gx + g.w - gx0) / BLK));
      const cy0 = Math.max(0, Math.ceil((g.gy - gy0) / BLK)), cy1 = Math.min(ny, Math.floor((g.gy + g.h - gy0) / BLK));
      for (let cy = cy0; cy < cy1; cy++) {
        const py = gy0 + cy * BLK - g.gy;
        for (let cx = cx0; cx < cx1; cx++) {
          const px = gx0 + cx * BLK - g.gx;
          const ux = (px + BLK / 2 - e.cx) / e.rx, uy = (py + BLK / 2 - e.cy) / e.ry;
          if (ux * ux + uy * uy > 0.96) continue;                    // fuera del círculo de cobertura (con margen)
          let sum = 0;
          for (let y = 0; y < BLK; y++) { const o = (py + y) * w + px; for (let x = 0; x < BLK; x++) sum += cls[o + x]; }
          const i = cy * nx + cx, v = sum * norm;
          cov[i] = 1;
          if (v > val[i]) val[i] = v;
        }
      }
    }
    return { val, cov };
  }

  // Desplazamiento (en celdas, con refinado de subcelda) que lleva el campo A al campo B: mínimo de la diferencia media absoluta
  // entre las celdas cubiertas en los dos instantes. {none:true} si no hay lluvia que seguir.
  function bestShift(A, B, nx, ny) {
    let rain = 0, area = 0;
    for (let i = 0; i < A.val.length; i++) if (A.cov[i]) { area++; if (A.val[i] > 0.02) rain++; }
    if (!area || rain / area < 0.004) return { none: true };
    const W = 2 * RSEARCH + 1, S = new Float32Array(W * W).fill(Infinity);
    let best = null;
    for (let dy = -RSEARCH; dy <= RSEARCH; dy++) for (let dx = -RSEARCH; dx <= RSEARCH; dx++) {
      let sum = 0, cnt = 0;
      const y0 = Math.max(0, -dy), y1 = Math.min(ny, ny - dy), x0 = Math.max(0, -dx), x1 = Math.min(nx, nx - dx);
      for (let y = y0; y < y1; y++) {
        const ra = y * nx, rb = (y + dy) * nx + dx;
        for (let x = x0; x < x1; x++) {
          if (!A.cov[ra + x] || !B.cov[rb + x]) continue;
          sum += Math.abs(A.val[ra + x] - B.val[rb + x]); cnt++;
        }
      }
      if (cnt < area * 0.4) continue;
      const score = sum / cnt;
      S[(dy + RSEARCH) * W + dx + RSEARCH] = score;
      if (!best || score < best.score - 1e-9 || (Math.abs(score - best.score) <= 1e-9 && dx * dx + dy * dy < best.dx * best.dx + best.dy * best.dy)) best = { dx, dy, score };
    }
    if (!best) return { none: true };
    const at = (dx, dy) => (Math.abs(dx) > RSEARCH || Math.abs(dy) > RSEARCH ? Infinity : S[(dy + RSEARCH) * W + dx + RSEARCH]);
    const peak = (m, c, p) => (isFinite(m) && isFinite(p) && m + p - 2 * c > 1e-9 ? Math.max(-0.5, Math.min(0.5, 0.5 * (m - p) / (m - 2 * c + p))) : 0);
    return { dx: best.dx + peak(at(best.dx - 1, best.dy), best.score, at(best.dx + 1, best.dy)),
             dy: best.dy + peak(at(best.dx, best.dy - 1), best.score, at(best.dx, best.dy + 1)), score: best.score };
  }
  // </forecast>

  // Zona de análisis: lo que se ve (con margen), entre 3°×2,2° y 7°×5°, centrada en el mapa; alineada a la rejilla de celdas.
  function analysisBox() {
    const b = map.getBounds().pad(0.3), c = map.getCenter(), d = rad.dx, O = rad.origin;
    const halfLon = Math.min(3.5, Math.max(1.5, (b.getEast() - b.getWest()) / 2));
    const halfLat = Math.min(2.5, Math.max(1.1, (b.getNorth() - b.getSouth()) / 2));
    return { nx: Math.round(2 * halfLon / d / BLK), ny: Math.round(2 * halfLat / d / BLK), lat: c.lat,
             gx0: Math.floor((c.lng - halfLon - O.west) / d / BLK) * BLK, gy0: Math.floor((O.north - (c.lat + halfLat)) / d / BLK) * BLK };
  }

  // Calcula rad.fc con las dos imágenes más recientes de la zona (movimiento uniforme) y cuántos pasos de 10 min hacen falta;
  // devuelve el motivo si no hay previsión (o null si la hay).
  function radForecast() {
    rad.fc = null;
    const tl = rad.timeline;
    if (!tl.length) return null;
    const TB = tl.at(-1);
    const ahora = Date.now() / 1000;
    if (ahora - TB > MAX_EDAD_PREV_S) return `la última imagen es ${hace(TB)}, demasiado antigua`;
    let TA = null;                                                    // la imagen más cercana a 20 min antes (al menos 10)
    for (const t of tl) if (TB - t >= STEP_S && (TA === null || Math.abs(TB - 2 * STEP_S - t) < Math.abs(TB - 2 * STEP_S - TA))) TA = t;
    if (TA === null) return 'faltan imágenes anteriores';
    const box = analysisBox();
    const A = analysisField(rad.tilesAt(TA), box, rad.nclases), B = analysisField(rad.tilesAt(TB), box, rad.nclases);
    const mv = bestShift(A, B, box.nx, box.ny);
    if (mv.none) return 'no hay lluvia significativa en esta zona';
    const dt = TB - TA, dlon = mv.dx * BLK * rad.dx, dlat = -mv.dy * BLK * rad.dx;     // las filas crecen hacia el sur
    const east = dlon * 111.19 * Math.cos(box.lat * Math.PI / 180), north = dlat * 111.19;
    // AEMET publica con retraso (la imagen más reciente suele tener 15-40 min): se avanza hasta 30 min después de «ahora»
    const steps = Math.min(MAX_STEPS, Math.max(MIN_STEPS, Math.ceil((ahora + 30 * 60 - TB) / STEP_S)));
    rad.fc = { vlon: dlon / dt, vlat: dlat / dt, kmh: Math.hypot(east, north) / dt * 3600, heading: Math.atan2(east, north) * 180 / Math.PI, steps };
    return null;
  }

  // ---- Línea de tiempo: imágenes observadas + instantes de previsión ----
  // Instantes previstos: los de pySTEPS posteriores a la última imagen; si no hay, el cálculo sencillo del navegador.
  const pvFrames = () => (rad.pv && rad.timeline.length ? rad.pv.frames.filter(f => f.T > rad.timeline.at(-1)) : []);
  const fcCount = () => { const n = pvFrames().length; return n || (rad.fc ? rad.fc.steps : 0); };
  const total = () => rad.timeline.length + fcCount();
  const timeAt = i => {
    const obs = rad.timeline.length;
    if (i < obs) return rad.timeline[i];
    const pv = pvFrames();
    return pv.length ? pv[i - obs].T : rad.timeline.at(-1) + STEP_S * (i - obs + 1);
  };
  const fcTilesAt = k => {                                   // k = 1, 2, … pasos después de la última imagen
    const pv = pvFrames();
    return pv.length ? [{ cls: pv[k - 1].cls, pal32: rad.pal32, geo: rad.pv.geo }] : rad.fcTiles(k);
  };
  let idx = 0, timer = null, follow = true;   // follow: mientras no se toque la línea de tiempo se muestra el instante más cercano a «ahora»
  const nowIdx = () => {
    const now = Date.now() / 1000, n = total();
    let b = 0;
    for (let i = 1; i < n; i++) if (Math.abs(timeAt(i) - now) < Math.abs(timeAt(b) - now)) b = i;
    return b;
  };

  function show(i) {
    const obs = rad.timeline.length, fc = i >= obs;
    idx = i;
    radarLayer.show(fc ? fcTilesAt(i - obs + 1) : rad.tilesAt(rad.timeline[i]));
    map.getContainer().classList.toggle('fc', fc);
    $('slider').value = i;
    $('clock').textContent = fmt.format(new Date(timeAt(i) * 1000));
    $('badge').textContent = fc ? 'previsión' : 'AEMET';
    $('badge').classList.toggle('fc', fc);
  }

  function play() {
    if (timer) return pause();
    if (!total()) return;
    follow = false;
    if (idx >= total() - 1) show(0);
    $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', 'Pausar');
    timer = setInterval(() => { if (idx >= total() - 1) return pause(); show(idx + 1); }, FRAME_MS);
  }
  function pause() {
    clearInterval(timer); timer = null;
    $('play').textContent = '▶'; $('play').setAttribute('aria-label', 'Reproducir');
  }

  function radStatus(motivo) {
    const used = Object.entries(rad.radars).filter(([, R]) => R.frames.size).map(([c]) => c);
    if (!rad.timeline.length) { setStatus('Ningún radar de AEMET con datos recientes cubre esta parte del mapa.'); return; }
    const last = rad.timeline.at(-1), edad = Date.now() / 1000 - last;
    let t = `Radares de AEMET (≈500 m): ${used.join(', ')}. Última imagen a las ${fmt.format(new Date(last * 1000))} (${hace(last)}).`;
    if (edad > 60 * 60) t += ' Ojo: AEMET lleva un rato sin publicar imágenes nuevas.';
    const pv = pvFrames();
    if (pv.length) {
      t += ` Previsión hasta las ${fmt.format(new Date(pv.at(-1).T * 1000))} con pySTEPS (movimiento por zonas; los detalles pequeños se suavizan con el tiempo)` +
        (rad.fc ? `: en esta zona la lluvia va hacia el ${compass(rad.fc.heading)} a unos ${Math.round(rad.fc.kmh)} km/h.` : '.');
      if (edad > 12 * 60) t += ' AEMET publica con retraso, así que lo más reciente que se ve ya es una estimación.';
    } else if (rad.fc) {
      t += ` Previsión experimental: la lluvia se mueve hacia el ${compass(rad.fc.heading)} a unos ${Math.round(rad.fc.kmh)} km/h.`;
      if (edad > 12 * 60) t += ' AEMET publica con retraso, así que lo más reciente que se ve ya es una estimación.';
    } else if (motivo) t += ` Sin previsión: ${motivo}.`;
    setStatus(t);
  }

  // Recarga lo que falta, recalcula la previsión y mantiene, si se puede, el instante que se estaba viendo.
  async function radRefresh(fresh) {
    if (fresh) await radManifest();
    const before = rad.timeline.length, was = idx, T = rad.timeline[idx];
    await Promise.all([radLoad(), fresh ? radLoadPrev() : null]);
    rad.buildTimeline();
    const motivo = radForecast(), obs = rad.timeline.length, n = total();
    $('slider').max = Math.max(0, n - 1);
    if (obs) {
      let k = nowIdx();
      if (!follow && before) {                                                                    // se respeta el instante elegido
        if (was >= before) k = Math.min(n - 1, obs + (was - before));
        else k = rad.timeline.reduce((b, t, i) => (Math.abs(t - T) < Math.abs(rad.timeline[b] - T) ? i : b), 0);
      }
      show(k);
    } else { radarLayer.hide(); $('clock').textContent = '--:--'; }
    radStatus(motivo);
  }

  // Un solo refresco a la vez; si falla (red, sin datos todavía) se reintenta a los 30 s; si va bien, a los 5 min.
  let queue = Promise.resolve(), nextTimer = null;
  function refresh(fresh) {
    queue = queue.then(async () => {
      clearTimeout(nextTimer);
      try { await radRefresh(fresh || !rad.manifest); nextTimer = setTimeout(() => refresh(true), REFRESCO_MS); }
      catch (e) {
        console.warn('AEMET radares:', e);
        setStatus(`No se pudieron cargar los radares de AEMET: ${e.message}. Reintentando…`);
        nextTimer = setTimeout(() => refresh(true), REINTENTO_MS);
      }
    });
    return queue;
  }

  // Panel "Cobertura": radares a menos de 240 km de la zona elegida, su distancia y la antigüedad de su última imagen.
  function showCobertura() {
    const man = rad.manifest, p = marker.getLatLng(), lista = $('cob-lista');
    lista.textContent = '';
    $('cob-zona').textContent = `Desde ${$('zona').selectedOptions[0].textContent}`;
    const filas = man ? Object.entries(man.radares)
      .map(([code, r]) => ({ code, r, d: km(p.lat, p.lng, r.lat, r.lon), s: rtime(r.imagenes.at(-1).t) }))
      .filter(x => x.d <= RADIO_KM).sort((a, b) => a.d - b.d) : [];
    for (const x of filas) {
      const li = document.createElement('li');
      const n = document.createElement('strong'); n.textContent = x.r.nombre || `Radar ${x.code}`;
      const h = document.createElement('span'); h.textContent = hace(x.s);
      const d = document.createElement('span'); d.textContent = `AEMET · a ≈${Math.round(x.d)} km`;
      li.append(n, h, d);
      lista.append(li);
    }
    if (!filas.length) { const li = document.createElement('li'); li.textContent = man ? 'Ningún radar activo a menos de 240 km.' : 'Todavía no se han cargado los radares.'; lista.append(li); }
    $('cob').showModal();
  }

  // ---- Controles ----
  $('play').addEventListener('click', play);
  $('slider').addEventListener('input', e => { pause(); follow = false; if (total()) show(+e.target.value); });
  $('cobbtn').addEventListener('click', showCobertura);
  $('zona').addEventListener('change', e => {
    const p = e.target.value.split(',').map(Number);
    map.setView(p, 8); marker.setLatLng(p);
  });
  {
    // En pantallas estrechas el panel inferior tapa la atribución: se sube por encima (CSS usa --panel-h).
    const panel = document.querySelector('.bottom .card');
    const lift = () => document.documentElement.style.setProperty('--panel-h', Math.max(0, innerHeight - panel.getBoundingClientRect().top) + 'px');
    if (window.ResizeObserver) new ResizeObserver(lift).observe(panel);
    addEventListener('resize', lift);
    lift();
  }
  let debounce = null;
  map.on('moveend', () => {       // al mover o hacer zoom se cargan los radares que faltan y se recalcula la previsión de esa zona
    if (!rad.manifest) return;
    clearTimeout(debounce);
    debounce = setTimeout(() => refresh(false), 600);
  });
  document.addEventListener('visibilitychange', () => {   // al volver a la pestaña tras un rato, datos al día
    if (!document.hidden && Date.now() - rad.loadedAt > REFRESCO_MS) refresh(true);
  });

  refresh(true);
})();
</script>
</body>
</html>
